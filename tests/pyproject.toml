[project]
name = "flow-state-tests"
version = "0.1.0"
description = "Tests for imap-slim"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "imap-slim-mcp",
]

[tool.uv.sources]
imap-slim-mcp = { path = "../imap-slim" }

[tool.pytest.ini_options]
testpaths = ["imap-slim"]
pythonpath = ["../imap-slim"]
python_files = "test_*.py"
python_functions = "test_*"
